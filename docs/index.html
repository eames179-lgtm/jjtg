      <template id="trigger-template-2">
        <h3
          data-ko="이지스 체계가 뭐냐구요?"
          data-en="What is the Aegis system?"
        ></h3>
        <div class="feature-media">
          <img src="/assets/popup2_1-PvNRf1w2.jpg" />
        </div>
        <p
          data-ko="'이지스'라는 이름은 그리스 신화에서 제우스가 딸 아테나에게 준 '절대 뚫리지 않는 방패'의 이름에서 따왔습니다."
          data-en="The name 'Aegis' comes from the 'absolutely impenetrable shield' that Zeus gave his daughter Athena in Greek mythology."
        ></p>
        <video autoplay muted loop controls playsinline preload="metadata">
          <source src="/assets/popup2_2-BN61wisg.mp4" type="video/mp4" />
